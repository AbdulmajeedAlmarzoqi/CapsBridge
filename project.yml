# XcodeGen spec. After adding or removing files, regenerate the Xcode project:
#   xcodegen generate
# CapsBridge.xcodeproj is committed, so the project opens in Xcode without XcodeGen.
name: CapsBridge
options:
  minimumXcodeGenVersion: "2.40"
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  CapsBridgeKit:
    path: Packages/CapsBridgeKit
settings:
  base:
    DEVELOPMENT_TEAM: JLNFD3HP3G
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # VMPal runs on Apple silicon only.
    ARCHS: arm64
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  CapsBridge:
    type: application
    platform: macOS
    sources:
      - path: Sources/CapsBridge
      - path: Resources/Assets.xcassets
      # Made in Icon Composer's format, which macOS renders as Liquid Glass in every appearance.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
      # macOS looks for the helper's launchd property list here when the app registers it as a login item.
      - path: Resources/LaunchAgents/com.abdulmajeedalmarzoqi.capsbridge.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: CapsBridgeKit
      # The helper is an app of its own inside this one, where the property list's BundleProgram points.
      # Run from this app's own Contents/MacOS, macOS would take it for the app itself, already open.
      - target: CapsBridgeHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_NAME: CapsBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulmajeedalmarzoqi.capsbridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CapsBridge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Abdulmajeed Almarzoqi"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets: []
      gatherCoverageData: false
  CapsBridgeHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources/CapsBridgeHelper
    dependencies:
      - package: CapsBridgeKit
    settings:
      base:
        PRODUCT_NAME: CapsBridgeHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulmajeedalmarzoqi.capsbridge.helper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CapsBridge Helper
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Abdulmajeed Almarzoqi"
        # No Dock icon, no menu bar, no windows.
        INFOPLIST_KEY_LSBackgroundOnly: YES
        SKIP_INSTALL: YES
